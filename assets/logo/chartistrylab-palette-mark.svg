<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="300 200 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Chartistry Lab palette data mark</title>
  <desc id="desc">A palette-shaped scientific data mark with Batlow-colored points, gradient borders, grid lines, and sine-like trace curves.</desc>
